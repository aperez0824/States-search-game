<style id="reliable-canvas-fireworks-start">
.start-screen{
  overflow:hidden !important;
  background:
    radial-gradient(circle at 18% 20%,rgba(255,255,255,.12),transparent 22%),
    radial-gradient(circle at 82% 30%,rgba(255,255,255,.10),transparent 24%),
    linear-gradient(135deg,#081c4a 0%,#f4f6f8 50%,#bf0a30 100%) !important;

.start-screen::after,
.start-bg-effects,
.usa-watermark,
.landmark,
.floating-stars,
.waving-flag,
.patriot-flag,
.start-fireworks-layer,
.start-jet,
.eagle,
.firework-pop,
.firework-burst{
  display:none !important;
}

.start-fireworks-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;

  position:relative !important;
  z-index:5 !important;

}

.start-screen.launching .start-card{
  animation:startCardFadeOut 1.15s ease-in forwards !important;
}

  animation:startCanvasFadeOut 1.2s ease-in forwards !important;
}

  0%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(.92);}
}

  0%{opacity:1;}
  100%{opacity:0;}
}
</style>


<style id="restore-soft-american-start-button">

  position:relative !important;

  border:3px solid rgba(255,255,255,.78) !important;

<body>
  <div class="start-screen" id="startScreen"><canvas id="startFireworksCanvas" class="start-fireworks-canvas"></canvas><div class="start-card"><div class="start-title">50 States Word Search</div><div class="start-subtitle">Find all 50 states. Every 5th word unlocks a challenge round.</div><input id="studentNameInput" class="student-name-input" type="text" placeholder="Enter your first and last name" autocomplete="off"><button id="startBtn" class="start-btn">START GAME</button></div></div>

    function configureChallengeExperience(n){stopAllChallengeEffects();showChallengePopup(challengeTarget);grid.classList.add("challenge-colors-active");challengeMode="target";if(n===5){challengeDisplay.textContent=`Target Challenge: ${getDisplayName(challengeTarget)} | ${challengeInfo("target")}`;showMessage(`Target Challenge: ${getChallengeRewardLabel("target")} | ${getChallengePenaltyLabel("target")}`,2600)}else if(n===10){challengeMode="flicker";grid.classList.add("flicker-active");challengeDisplay.textContent=`Fading Letters: ${getDisplayName(challengeTarget)} | ${challengeInfo("target")}`;showMessage(`Fading Letters: ${getChallengeRewardLabel("target")} | ${getChallengePenaltyLabel("target")}`,2600)}else if(n===15){challengeMode="rowEscape";challengeDisplay.textContent=`Row Escape: ${getDisplayName(challengeTarget)} | ${challengeInfo("rowEscape")}`;startRowEscapeAfterDelay(1,1000,5500)}else if(n===20){challengeMode="pressure";challengeDisplay.textContent=`Pressure Round: ${getDisplayName(challengeTarget)} | ${challengeInfo("pressure")}`;showMessage(`Pressure Round: ${getChallengeRewardLabel("pressure")} | Wrong: -35 | Timer: -50`,3000);startPressureCountdown(20,50)}else if(n===25){challengeMode="danger";challengeDisplay.textContent=`Danger Round: ${getDisplayName(challengeTarget)} | ${challengeInfo("danger")}`;showMessage(`Danger Round: ${getChallengeRewardLabel("danger")} | ${getChallengePenaltyLabel("danger")}`,3000);startDangerEffects()}else if(n===30){challengeMode="combo";grid.classList.add("flicker-active");challengeDisplay.textContent=`Combo Round: ${getDisplayName(challengeTarget)} | ${challengeInfo("combo")}`;startRowEscapeAfterDelay(2,1000,5200);showMessage(`Combo Round: ${getChallengeRewardLabel("combo")} | ${getChallengePenaltyLabel("combo")}`,3000)}else if(n===35){challengeMode="pressure";challengeDisplay.textContent=`Precision Round: ${getDisplayName(challengeTarget)} | ${challengeInfo("pressure")}`;showMessage(`Precision Round: ${getChallengeRewardLabel("pressure")} | Wrong: -35 | Timer: -75`,3000);startPressureCountdown(15,75)}else if(n===40){challengeMode="highPressure";challengeDisplay.textContent=`High Pressure: ${getDisplayName(challengeTarget)} | ${challengeInfo("highPressure")}`;startRowEscapeAfterDelay(1,1000,5600);startMirrorEffects(6500,850,true,2,2800);showMessage(`High Pressure: ${getChallengeRewardLabel("highPressure")} | ${getChallengePenaltyLabel("highPressure")}`,3000)}else if(n===45){challengeMode="finalStretch";grid.classList.add("flicker-active");challengeDisplay.textContent=`Final Stretch: ${getDisplayName(challengeTarget)} | ${challengeInfo("finalStretch")}`;startPressureCountdown(18,90);startLetterExplosionCountdown(15);showMessage(`Final Stretch: letters explode every 15 seconds. ${getChallengeRewardLabel("finalStretch")} | Wrong: -70 | Timer: -90`,3600)}else if(n===50){challengeMode="finalBoss";finalBossClickMode=true;app.classList.add("final-boss-active");grid.classList.add("flicker-active");challengeDisplay.textContent=`Final Word: ${getDisplayName(challengeTarget)} | ${challengeInfo("finalBoss")}`;startRowEscapeAfterDelay(2,1000,4200);startMirrorEffects(2400,1300,true,6,1400);startSwapDistraction(1500);startDangerEffects();startPressureCountdown(20,100);showMessage(`FINAL WORD: ${getChallengeRewardLabel("finalBoss")} | Wrong: -80 | Timer: -100`,4200)}else challengeDisplay.textContent=`Challenge: ${getDisplayName(challengeTarget)} | ${challengeInfo("target")}`}function chooseChallengeTarget(){const n=foundWords.size+1;if(n%5!==0||foundWords.size>=words.length){challengeTarget=null;challengeMode="none";stopAllChallengeEffects();challengeDisplay.textContent="50 STATES";return}const num=n/5;let group="hard";if(num<=2)group="easy";else if(num<=5)group="medium";let pool=challengeGroups[group].filter(k=>!foundWords.has(k));if(pool.length===0)pool=wordKeys.filter(k=>!foundWords.has(k));challengeTarget=pool[Math.floor(Math.random()*pool.length)];configureChallengeExperience(n)}
    function completeMatchedWord(matched){playCorrectSound();foundWords.add(matched);const colorClass=`found-color-${foundColorIndex%8}`;foundColorIndex++;currentSelection.forEach(c=>{c.classList.remove("selecting","boss-clicked","boss-blast","found-color-0","found-color-1","found-color-2","found-color-3","found-color-4","found-color-5","found-color-6","found-color-7");c.classList.add("found",colorClass);c.textContent=c.dataset.letter});document.getElementById(`word-${matched}`)?.classList.add("found");const pts=challengeTarget?challengeReward():100+speedBonus();addScore(pts);showMessage(`Found: ${getDisplayName(matched)} +${pts}`);updateProgress();if(challengeTarget)stopAllChallengeEffects();chooseChallengeTarget();if(foundWords.size===words.length)celebrateWin()}function acceptSelection(){
      const text=selectedText(),reversed=[...text].reverse().join("");
      const matched=matchedPlacedWord();
      const spelledWord=wordKeys.includes(text)?text:(wordKeys.includes(reversed)?reversed:null);
      if(spelledWord&&foundWords.has(spelledWord)){
        clearTemporarySelection();
        showMessage("That state was already found.");
      }else if(spelledWord&&!matched){
        clearTemporarySelection();
        triggerNormalMistakeEffect();
        const longer=wordKeys.find(w=>w!==spelledWord&&w.includes(spelledWord)&&!foundWords.has(w));
        if(longer)showMessage(`That is part of ${getDisplayName(longer)} or not the placed location. Find the actual ${getDisplayName(spelledWord)} location.`);
        else showMessage("That is not the placed location for that state.");
      }else if(challengeTarget&&matched!==challengeTarget){
        clearTemporarySelection();
        const p=challengePenalty();
        addScore(p);
        triggerChallengeMistakeEffect();
        showMessage(`Wrong target. ${p} points. Find ${getDisplayName(challengeTarget)}.`);
      }else if(matched){
        completeMatchedWord(matched);
      }else{
        clearTemporarySelection();
        if(text.length>1){
          const p=challengeTarget?challengePenalty():-10;
          addScore(p);
          if(challengeTarget){
            triggerChallengeMistakeEffect();
            showMessage(`Wrong highlight. Challenge penalty: ${p}`);
          }else{
            triggerNormalMistakeEffect();
            showMessage("Wrong highlight: -10");
          }
        }
      }
      currentSelection=[];
      startCell=null;
      isSelecting=false;
      previousSelectionKeys=new Set();
    }function handleFinalBossClick(cell){if(!challengeTarget||!finalBossClickMode)return;const idx=bossClickedCells.length,expected=challengeTarget[idx];if(cell.dataset.letter===expected&&!cell.classList.contains("boss-clicked")){bossClickedCells.push(cell);cell.classList.add("boss-clicked");cell.classList.remove("boss-blast");void cell.offsetWidth;cell.classList.add("boss-blast");setTimeout(()=>cell.classList.remove("boss-blast"),600);const clickNumber=bossClickedCells.length,isFinal=clickNumber===challengeTarget.length;playFinalWordClickSound(clickNumber,challengeTarget.length,isFinal);createClickExplosion(cell,clickNumber,challengeTarget.length,isFinal);currentSelection=bossClickedCells;if(isFinal)setTimeout(()=>completeMatchedWord(challengeTarget),260)}else{addScore(challengePenalty());triggerChallengeMistakeEffect();bossClickedCells.forEach(c=>c.classList.remove("boss-clicked","boss-blast"));bossClickedCells=[];currentSelection=[];showMessage("Final Boss mistake. Start the word again.")}}function updateProgress(){progress.textContent=`${foundWords.size} / ${words.length}`;gradeDisplay.textContent=`Grade: ${foundWords.size*2} / 100`;if(foundWords.size===words.length){showMessage("Puzzle complete.");clearInterval(timerId)}}function startTimer(){clearInterval(timerId);seconds=0;timerId=setInterval(()=>{seconds++;const m=String(Math.floor(seconds/60)).padStart(2,"0"),s=String(seconds%60).padStart(2,"0");timer.textContent=`⏱ ${m}:${s}`},1000)}function celebrateWin(){playCelebrationSound();const overlay=document.createElement("div");overlay.className="fireworks";document.body.appendChild(overlay);const confetti=createWinConfetti();const banner=document.createElement("div");banner.className="win-banner";banner.innerHTML=`PUZZLE COMPLETE<br><span style="font-size:40%; color:#bf0a30;">Final Score: ${score}</span>`;document.body.appendChild(banner);const bursts=[["12%","20%"],["28%","15%"],["44%","18%"],["60%","16%"],["78%","22%"],["18%","40%"],["36%","34%"],["54%","38%"],["72%","35%"],["86%","44%"],["24%","62%"],["42%","56%"],["58%","62%"],["76%","60%"]];bursts.forEach(([x,y],bi)=>{for(let wave=0;wave<2;wave++){const count=wave===0?34:26;for(let i=0;i<count;i++){const p=document.createElement("div");p.className="firework";p.style.setProperty("--x",x);p.style.setProperty("--y",y);p.style.setProperty("--angle",`${360/count*i}deg`);p.style.setProperty("--distance",`${100+i%6*18+wave*16}px`);p.style.setProperty("--h",`${(bi*31+i*11+wave*45)%360}`);p.style.animationDelay=`${bi*.09+wave*.18}s`;overlay.appendChild(p)}}});setTimeout(()=>{overlay.remove();confetti.remove();banner.remove()},6200)}function resetPuzzle(){foundWords=new Set();foundColorIndex=0;startCell=null;currentSelection=[];previousSelectionKeys=new Set();bossClickedCells=[];isSelecting=false;score=0;challengeTarget=null;challengeMode="none";gameStarted=false;stopAllChallengeEffects();scoreDisplay.textContent="Score: 0";challengeDisplay.textContent="50 STATES";gradeDisplay.textContent="Grade: 0 / 100";studentNameDisplay.textContent="Name: Not entered";studentNameInput.value="";makePuzzle();buildGrid();document.querySelectorAll(".word").forEach(w=>w.classList.remove("found"));updateProgress();chooseChallengeTarget();clearInterval(timerId);seconds=0;timer.textContent="⏱ 00:00";startScreen.classList.remove("hidden");startStartScreenFireworks()}
    
/* Canvas fireworks on start screen. Adapted from the uploaded particle-burst idea but using the page's red/white/blue colors. */
let startFwCtx=null,startFwParticles=[],startFwAnim=null,startFwTimer=null;
const startFwColors=["#bf0a30","#ffffff","#002868","#0a3161","#ffcc33","#d8e6ff"];

class StartParticle{
  constructor(x,y,vx,vy,color){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.alpha=1;
    this.radius=Math.random()*4+3;this.gravity=.18;
  }
  update(){
    this.vy+=this.gravity;
    this.x+=this.vx;
    this.y+=this.vy;
    this.alpha-=.012;
    this.radius*=.985;
  }
  draw(ctx){
    ctx.save();
    ctx.globalAlpha=Math.max(0,this.alpha);
    ctx.shadowBlur=22;
    ctx.shadowColor=this.color;
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function resizeStartFireworksCanvas(){
  if(!startFireworksCanvas)return;
  const rect=startScreen.getBoundingClientRect();
  const ratio=window.devicePixelRatio||1;
  startFireworksCanvas.width=Math.max(1,Math.floor(rect.width*ratio));
  startFireworksCanvas.height=Math.max(1,Math.floor(rect.height*ratio));
  startFireworksCanvas.style.width=rect.width+"px";
  startFireworksCanvas.style.height=rect.height+"px";
  startFwCtx=startFireworksCanvas.getContext("2d");
  startFwCtx.setTransform(ratio,0,0,ratio,0,0);
}

function createStartFireworkCssPx(x,y,count=80){
  if(!startFireworksCanvas)return;
  if(!startFwCtx)resizeStartFireworksCanvas();
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=3+Math.random()*11;
    startFwParticles.push(new StartParticle(
      x,y,
      Math.cos(angle)*speed,
      Math.sin(angle)*speed-4,
      startFwColors[Math.floor(Math.random()*startFwColors.length)]
    ));
  }
}

function animateStartFireworks(){
  if(!startFireworksCanvas||!startFwCtx)return;
  const rect=startFireworksCanvas.getBoundingClientRect();
  startFwCtx.clearRect(0,0,rect.width,rect.height);
  for(let i=startFwParticles.length-1;i>=0;i--){
    const p=startFwParticles[i];
    p.update();
    p.draw(startFwCtx);
    if(p.alpha<=0||p.radius<=.3)startFwParticles.splice(i,1);
  }
  startFwAnim=requestAnimationFrame(animateStartFireworks);
}

function startStartScreenFireworks(){
  if(!startFireworksCanvas)return;
  resizeStartFireworksCanvas();
  cancelAnimationFrame(startFwAnim);
  startFwParticles=[];
  animateStartFireworks();
  clearInterval(startFwTimer);

  // Immediate page-load sequence.
  setTimeout(()=>createStartFireworkCssPx(window.innerWidth*.50,window.innerHeight*.24,130),80);
  setTimeout(()=>createStartFireworkCssPx(window.innerWidth*.22,window.innerHeight*.36,100),320);
  setTimeout(()=>createStartFireworkCssPx(window.innerWidth*.78,window.innerHeight*.34,100),560);
  setTimeout(()=>createStartFireworkCssPx(window.innerWidth*.35,window.innerHeight*.18,90),860);

  // Ongoing random fireworks.
  startFwTimer=setInterval(()=>{
    if(startScreen.classList.contains("hidden")||startScreen.classList.contains("launching"))return;
    const x=window.innerWidth*(.12+Math.random()*.76);
    const y=window.innerHeight*(.10+Math.random()*.38);
    createStartFireworkCssPx(x,y,70+Math.floor(Math.random()*40));
  },650);
}

function typingFireworks(){
  studentNameInput.classList.add("typing-glow");
  clearTimeout(typingFireworks.glow);
  typingFireworks.glow=setTimeout(()=>studentNameInput.classList.remove("typing-glow"),450);
  const r=studentNameInput.getBoundingClientRect();
  createStartFireworkCssPx(r.left+r.width/2,r.top-24,100);

  // Faster fireworks while typing.
  clearInterval(startFwTimer);
  startFwTimer=setInterval(()=>{
    if(startScreen.classList.contains("hidden")||startScreen.classList.contains("launching"))return;
    createStartFireworkCssPx(window.innerWidth*(.15+Math.random()*.70),window.innerHeight*(.10+Math.random()*.42),80);
  },350);
  clearTimeout(typingFireworks.timer);
  typingFireworks.timer=setTimeout(startStartScreenFireworks,1800);
}


function startScreenClickFirework(e){
  if(startScreen.classList.contains("hidden")||startScreen.classList.contains("launching"))return;
  if(e.target.closest(".start-card"))return;
  createStartFireworkCssPx(e.clientX,e.clientY,105);
}

grid.addEventListener("pointerdown",e=>{if(!gameStarted)return;if(!e.target.classList.contains("cell"))return;clearTemporarySelection();if(finalBossClickMode){handleFinalBossClick(e.target);return}isSelecting=true;startCell=e.target;previousSelectionKeys=new Set();try{grid.setPointerCapture(e.pointerId)}catch(err){}updateSelection(e.target)});grid.addEventListener("pointermove",e=>{if(!isSelecting||finalBossClickMode)return;const cell=getCellFromPoint(e.clientX,e.clientY);if(cell)updateSelection(cell)});function finishSelection(e){if(!isSelecting||finalBossClickMode)return;if(e&&typeof e.pointerId!=="undefined"){try{if(grid.hasPointerCapture(e.pointerId))grid.releasePointerCapture(e.pointerId)}catch(err){}}acceptSelection()}grid.addEventListener("pointerup",finishSelection);grid.addEventListener("pointercancel",finishSelection);window.addEventListener("pointerup",finishSelection);resetBtn.addEventListener("click",resetPuzzle);startBtn.addEventListener("click",startGame);studentNameInput.addEventListener("keydown",e=>{if(e.key==="Enter")startGame()});studentNameInput.addEventListener("input",typingFireworks);startScreen.addEventListener("click",startScreenClickFirework);window.addEventListener("resize",resizeStartFireworksCanvas);makePuzzle();buildWordList();buildGrid();updateProgress();chooseChallengeTarget();timer.textContent="⏱ 00:00";startStartScreenFireworks();
